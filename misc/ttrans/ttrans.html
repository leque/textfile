<!DOCTYPE html>
<html>
  <head>
    <title>テキスト変換ツール</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP&display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Hentaigana:wght@200..900&display=swap');
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <style type="text/css">
      #text, #result, #translation-rule {
          font-family : "Noto Serif JP", "Noto Serif Hentaigana", var(--bs-font-sans-serif);
      }
      #translation-rule-select {
        background-color: var(--bs-tertiary-bg);
      }
      button:not([disabled]) > *[role="status"] {
          display : none;
      }
    </style>
    <script>
      const colorScheme = window.matchMedia("(prefers-color-scheme: dark)");

      function applyColorScheme(event) {
        document.documentElement.setAttribute(
          "data-bs-theme",
          event.matches ? "dark" : "light"
        );
      }

      applyColorScheme(colorScheme);
      colorScheme.addEventListener("change", applyColorScheme);
    </script>
    <script type="application/javascript" src="./ttrans.js"></script>
    <script type="application/javascript">
      function withErrorReport(f) {
          const errorDiv = document.getElementById('error');
          errorDiv.style.display = 'none';
          try {
              f();
          } catch (e) {
              errorDiv.replaceChildren('' + e);
              errorDiv.style.display = 'block';
          }
      }
      function withProgress(buttonId, f) {
          document.getElementById(buttonId).disabled = true;
          setTimeout(() => {
              try {
                  f();
              } finally {
                  document.getElementById(buttonId).disabled = false;
              }
          }, 1);
      }
      function selectRule() {
          switch(document.getElementById('translation-rule-select').value) {
          case 'ja-hepburn':
              return jaHepburnRule;
          case 'ja-kunrei':
              return jaKunreiRule;
          case 'ja-old-hepburn':
              return jaOldHepburnRule;
          case 'ja-waapuro-hepburn':
              return jaWaapuroHepburnRule;
          case 'ja-waapuro-kunrei':
              return jaWaapuroKunreiRule;
          case 'ja-waapuro-kunrei-joudai':
              return jaWaapuroKunreiJoudaiRule;
          case 'la-kana':
              return latinKanaRule;
          case 'la-kana-pedantic':
              return latinKanaPedanticRule;
          case 'la-kana-mod':
              return latinKanaModRule;
          case 'ja-chem-kana':
              return jaChemKanaRule;
          default:
              return [];
          }
      }
      function populateRule() {
          withErrorReport(() => {
              const rule = selectRule();
              const t = document.getElementById('translation-rule');
              t.disabled = rule.length > 4000;
              if (t.disabled) {
                  t.value = "...";
              } else {
                  const text = rule.map((r, i, a) => ("  " + JSON.stringify(r) + (i == a.length - 1 ? "" : ",") + "\n")).join("");
                  t.value = "[\n" + text + "]\n";
              }
          });
      }
      function doIt() {
          withProgress("button-do-it", () => {
              withErrorReport(() => {
                  const text = document.getElementById('text').value;
                  const tr = document.getElementById('translation-rule');
                  const rule = tr.disabled ? selectRule() : JSON.parse(tr.value);
                  const converted = ttrans(text, rule);
                  document.getElementById('result').value = converted;

                  const r = document.getElementById('translation-rule-select').value;
                  const searchParams = new URLSearchParams({t: text, rule: r});
                  document.getElementById('permalink').href = '?' + searchParams;
              });
          });
      }
      function clearText() {
          withErrorReport(() => {
              document.getElementById('text').value = "";
          });
      }
      function copyResult() {
          withErrorReport(() => {
              const t = document.getElementById('result');
              t.focus();
              t.select();
              document.execCommand('copy');
              t.blur();
              window.getSelection().removeAllRanges();
          });
      }

      window.addEventListener('load', (_event) => {
          const params = new URL(document.location).searchParams;
          const t = params.get('t');
          const r = params.get('rule');
          if (r) {
              document.getElementById('translation-rule-select').value = r;
          }
          populateRule()
          if (t) {
              document.getElementById('text').value = t;
              doIt();
          }
      });
</script>
    <style>
      #error {
          display : none;
      }
    </style>
  </head>
  <body>
    <div class="container mt-4 mb-5">
    <h1>テキスト変換ツール</h1>
    <ul>
      <li>
        <a href="#translation-rule">変換規則</a>を指定して、<a href="#text">入力テキスト</a>を変換します。
        変換規則は編集できます。規則は雰囲気で読んで下さい。
      </li>
      <li>変換はすべてブラウザ内で行なっています。入力内容がサーバーに送信されることはありません。</li>
    </ul>
    <hr />
    <div id="error" class="alert alert-danger">
    </div>
    <div>
      <div class="d-flex justify-content-between align-items-center mb-1">
        <label for="text" class="form-label mb-0">入力テキスト</label>
        <button type="button" class="btn btn-sm btn-link p-0" onclick="clearText()">
          <i class="bi bi-eraser me-1" aria-hidden="true"></i>クリア
        </button>
      </div>
      <textarea id="text" class="form-control" rows="10"></textarea>
      <button id="button-do-it" class="btn btn-primary" onclick="doIt()" type="button">
        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        変換
      </button>
      <div class="d-flex justify-content-between align-items-center mb-1 mt-3">
        <label for="result" class="form-label mb-0">変換結果（<a id="permalink" href="">permalink</a>）</label>
        <button type="button" class="btn btn-sm btn-link p-0" onclick="copyResult()">
          <i class="bi bi-copy me-1" aria-hidden="true"></i>コピー
        </button>
      </div>
      <textarea id="result" class="form-control" rows="10"></textarea>
      <hr />
      <div class="form-group">
        <label for="translation-rule-select">変換規則（<code>Array<{ pattern: string; replacement: string; next?: string }></code>）</label>
        <div>
          <div>
            <select id="translation-rule-select" class="form-select" onchange="populateRule()">
              <optgroup label="ローマ字→カタカナ">
                <option value="ja-hepburn">ヘボン式ローマ字</option>
                <option value="ja-kunrei">訓令式ローマ字</option>
                <option value="ja-old-hepburn">旧ヘボン式ローマ字</option>
                <option value="ja-waapuro-hepburn">ヘボン式風ワープロローマ字</option>
                <option value="ja-waapuro-kunrei">訓令式風ワープロローマ字</option>
              </optgroup>
              <optgroup label="ラテン文字→カタカナ">
                <option value="la-kana">古典ラテン語カナ転写</option>
                <option value="la-kana-pedantic">古典ラテン語カナ転写（拡張版）</option>
                <option value="la-kana-mod">ラテン語カナ転写（現代的子音音価版）</option>
                <option value="ja-chem-kana">日本化学会「化合物名字訳基準」</option>
              </optgroup>
              <optgroup label="ローマ字→ひらがな">
                <option value="ja-waapuro-kunrei-joudai">訓令式風ワープロローマ字+上代特殊仮名遣</option>
              </optgroup>
            </select>
          </div>
        </div>
        <div>
          <div>
            <textarea id="translation-rule" class="form-control" rows="10"></textarea>
          </div>
        </div>
      </div>
    </div>
    <h2>サンプル</h2>

      <li><a href="?t=ame2tutino2+wakaresito2ki1yu+kamusabi2te+takakutahuto1ki1%0Asuruganaru+huzino2takanewo+amano2hara+hurisake2mi1reba%0Awataruhi1no2+kage2mo2kakurahi1+terutuki2no2+hi1karimo2mi1yezu%0Asirakumo1mo2+iyuki1habakari+to2ki1zikuso2+yuki1hahurike1ru%0Akataritugi1+ihi1tugi1yukamu+huzino2takaneha%0A&rule=ja-waapuro-kunrei-joudai">万葉集 317</a></li>
      <li><a href="?t=%E3%83%86%E3%82%A3%E3%83%A9%E3%83%8E%E3%82%B5%E3%82%A6%E3%83%AB%E3%82%B9+%E2%80%94+Tyrannosaurus%0A%E3%82%B9%E3%83%94%E3%83%8E%E3%82%B5%E3%82%A6%E3%83%AB%E3%82%B9+%E2%80%94+Spinosaurus%0A%E3%83%96%E3%83%A9%E3%82%AD%E3%82%AA%E3%82%B5%E3%82%A6%E3%83%AB%E3%82%B9+%E2%80%94+Brachiosaurus%0A%E3%83%87%E3%82%A4%E3%83%8E%E3%83%8B%E3%82%AF%E3%82%B9+%E2%80%94+Deinonychus%0A%E3%83%B4%E3%82%A7%E3%83%AD%E3%82%AD%E3%83%A9%E3%83%97%E3%83%88%E3%83%AB+%E2%80%94+Velociraptor%0A%E3%83%88%E3%83%AA%E3%82%B1%E3%83%A9%E3%83%88%E3%83%97%E3%82%B9+%E2%80%94+Triceratops%0A%E3%83%97%E3%83%86%E3%83%A9%E3%83%8E%E3%83%89%E3%83%B3+%E2%80%94+Pteranodon%0A%E3%82%A2%E3%83%B3%E3%82%AD%E3%83%AD%E3%82%B5%E3%82%A6%E3%83%AB%E3%82%B9+%E2%80%94+Ankylosaurus%0A%E3%82%A2%E3%83%BC%E3%82%B1%E3%82%AA%E3%83%97%E3%83%86%E3%83%AA%E3%82%AF%E3%82%B9+%E2%80%94+Archaeopteryx%0A%E3%83%91%E3%83%A9%E3%82%B5%E3%82%A6%E3%83%AD%E3%83%AD%E3%83%95%E3%82%B9+%E2%80%94+Parasaurolophus&rule=la-kana">恐竜の名前</a></li>
